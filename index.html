<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Agent First Login Tracker</title>

<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>

<body>

<h1>Agent First Login Tracker</h1>

<div class="controls">
  <input type="file" id="fileInput">
  <input type="text" id="search" placeholder="Search Agent..." onkeyup="filterTable()">
  <button onclick="processFile()">Upload</button>
  <button onclick="openAdmin()">Add Agent Details</button>
  <button onclick="resetPage()">Reset</button>
</div>

<!-- Admin Panel -->
<div id="adminPanel" class="modal">
  <div class="modal-content">
    <h2>Add Agent</h2>

    <input id="aid" placeholder="Employee ID"><br>
    <input id="aname" placeholder="Agent Name"><br>
    <input id="shift" placeholder="Shift (07:00)"><br>
    <input id="weekoff" placeholder="Week Off"><br>

    <button onclick="saveAgent()">Save</button>

    <hr>

    <h3>Bulk Upload</h3>
    <input type="file" id="bulkFile"><br>
    <button onclick="bulkUpload()">Upload Excel</button>

    <br><br>
    <button onclick="closeAdmin()">Close</button>
  </div>
</div>

<div id="tableContainer"></div>

<script src="script.js"></script>

</body>
</html>
