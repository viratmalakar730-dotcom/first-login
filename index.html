<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Agent First Login Tracker</title>

<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>

<body>

<h1>Agent First Login Tracker</h1>

<div class="controls">
  <input type="file" id="fileInput">
  <input type="text" id="search" placeholder="Search Agent..." onkeyup="filterTable()">

  <button onclick="processFile()">Upload</button>
  <button onclick="resetPage()">Reset</button>

  <!-- 🔥 Roster Button -->
  <button class="roster-btn" onclick="openRoster()">Roster</button>
</div>

<!-- 🔐 ROSTER PANEL -->
<div id="rosterPanel" class="modal">
  <div class="modal-content">

    <h2>Roster Management</h2>

    <!-- Manual -->
    <input id="aid" placeholder="Employee ID"><br>
    <input id="aname" placeholder="Agent Name"><br>
    <input id="shift" placeholder="Shift (07:00)"><br>
    <input id="weekoff" placeholder="Week Off"><br>

    <button onclick="saveAgent()">Add Agent</button>

    <hr>

    <!-- Bulk -->
    <h3>Bulk Upload</h3>
    <input type="file" id="bulkFile"><br>
    <button onclick="bulkUpload()">Upload Excel</button>

    <hr>

    <!-- View -->
    <button onclick="showAgents()">View Agents</button>

    <br><br>
    <button onclick="closeRoster()">Close</button>

  </div>
</div>

<div id="tableContainer"></div>

<script src="script.js"></script>

</body>
</html>
